name: Build ASI
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile
        shell: cmd
        run: cl /LD /O2 /EHsc /I"sdk\inc" script.cpp /link "sdk\lib\ScriptHookRDR2.lib" /OUT:KeepOffhandWeapon.asi
      - uses: actions/upload-artifact@v4
        with:
          name: KeepOffhandWeapon
          path: KeepOffhandWeapon.asi
 
